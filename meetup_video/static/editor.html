<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devin Meetup Seoul · 영상 편집</title>
<style>
body{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;margin:0;background:#0f1320;color:#e8ecf2}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;background:#151b2c;border-bottom:1px solid #2a3350;position:sticky;top:0;z-index:2;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}
h3{font-size:18px;margin:0 0 12px;color:#ffffff}
nav a{color:#2dd4bf;margin-left:12px;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:20px}
.layout{display:flex;max-width:1340px;margin:0 auto}
aside{width:230px;flex:none;padding:20px 0 20px 20px;position:sticky;top:64px;align-self:flex-start}
aside h3{font-size:15px;color:#9aa6bd;margin:0 0 10px}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{background:#151b2c;color:#e8ecf2;border:1px solid #2a3350;text-align:left;font-weight:600;padding:10px 12px}
.plist button.on{border-color:#2dd4bf;background:#12302d;color:#ffffff}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;background:#2a3350;color:#cfd6e4}
.badge.qr{background:#5b3fd1;color:#fff}
#saveas{width:100%;margin-top:10px}
main{flex:1;min-width:0}
@media (max-width:700px){
 .layout{display:block}
 aside{width:auto;position:static;padding:12px 12px 0}
 .plist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .plist button{flex:none}
}
.card{background:#151b2c;border:1px solid #2a3350;border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid.scene{grid-template-columns:repeat(3,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}
.wide{grid-column:1/-1}
@media (max-width:700px){.grid.scene,.grid.four{grid-template-columns:1fr}}
label{display:block;font-size:14px;font-weight:600;color:#dde3ee;margin-bottom:4px}
input,textarea{width:100%;box-sizing:border-box;background:#0b0f1a;color:#ffffff;border:1px solid #3a4566;border-radius:6px;padding:8px;font:inherit;font-size:15px}
input[type=file]{color:#dde3ee;background:transparent;border:0;padding:6px 0;width:auto}
input[type=file]::file-selector-button{background:#2a3350;color:#ffffff;border:1px solid #3a4566;border-radius:6px;padding:6px 12px;margin-right:10px;font:inherit;cursor:pointer}
.filerow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.filerow audio{flex:1;min-width:240px;height:40px}
textarea{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;min-height:84px;resize:vertical}
button{background:#2dd4bf;color:#05211d;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
button.alt{background:#2a3350;color:#e8ecf2}
.thumb{max-width:220px;border-radius:6px;display:block;margin-top:6px}
#msg{min-height:20px;color:#ffd666}
video{width:100%;margin-top:10px;border-radius:8px}
.globe-card{--globe-accent:#76f7ce;overflow:hidden}
.globe-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:8px;background:#0d2134;color:var(--globe-accent)}
.globe-banner h3{margin:4px 0 0}
.globe-banner small{font-size:11px;font-weight:700;letter-spacing:.08em}
.globe-total{white-space:nowrap;font-size:24px}
.globe-help{margin:12px 0;color:#a9b8cc;font-size:13px}
.globe-settings{max-width:180px;margin-bottom:14px}
.globe-region{background:#111727;border:1px solid #2a3350;border-radius:8px;margin-top:6px}
.globe-region summary{cursor:pointer;padding:10px 12px;color:#e8ecf2;font-weight:700}
.globe-region summary span{float:right;color:var(--globe-accent)}
.globe-countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 24px;padding:4px 12px 10px}
.globe-countries label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0;font-weight:500}
.globe-countries input{width:78px;flex:none;color:var(--globe-accent);text-align:right;font-variant-numeric:tabular-nums}
.globe-cities{border-top:1px solid #2a3350;padding:0 12px 12px}
.globe-cities summary{padding-inline:0}
.globe-city-rows{max-height:330px;overflow:auto;margin-bottom:8px}
.globe-city-row{display:grid;grid-template-columns:repeat(2,minmax(0,1.35fr)) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;padding:8px 4px;border-bottom:1px solid #2a3350}
.globe-city-row input{width:100%;min-width:0}
@media (max-width:720px){.globe-city-row{grid-template-columns:repeat(3,minmax(0,1fr))}.globe-city-row>div:nth-child(-n+2){grid-column:1/-1}.globe-city-row button{justify-self:start}}
@media (max-width:420px){.globe-banner{padding:12px}.globe-banner h3{font-size:15px}.globe-total{font-size:20px}.globe-countries{grid-template-columns:1fr}}
.clip-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.clip-head h3{margin:0}
.clip-head button + button{margin-left:6px}
.clip-head button:disabled{opacity:.45;cursor:default}
.clip-cues{margin-top:12px}
.clip-cues summary{cursor:pointer;color:#e8ecf2;font-weight:700}
.clip-cue{border-top:1px solid #2a3350;padding:10px 0;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.clip-cue:first-of-type{margin-top:10px}
.clip-cue textarea{min-height:64px}
</style></head><body>
<header><h1>Devin Meetup Seoul · 영상 편집 <small>(Video editor)</small></h1>
<span id="total"></span>
<button id="save">저장 Save</button><button id="preview" class="alt">미리보기 렌더 Preview</button><button id="final" class="alt">최종 렌더 Final</button>
<nav><a href="/manual/ko" target="_blank">매뉴얼</a><a href="/manual/en" target="_blank">Manual</a></nav></header>
<div class="layout">
<aside><h3>저장 목록 · Saved</h3><div class="plist" id="plist"></div>
<button id="saveas" class="alt">+ 새 이름으로 저장 Save as</button></aside>
<main>
<div id="msg"></div>
<div class="card" id="status" hidden><b>렌더 Render</b> <span id="prog"></span><video id="vid" controls hidden></video></div>
<div id="globe-scenes"></div>
<div id="clip-scenes"></div>
<div class="card"><h3>엔딩 · Ending</h3><div class="grid" id="ending"></div></div>
<div class="card"><h3>배경음악 · Music</h3><div class="grid four" id="music"></div></div>
<div class="card"><h3>영상 · Video</h3><div class="grid" id="video"></div></div>
<div id="scenes"></div>
</main>
</div>
<script>
let cfg, cur = localStorage.getItem("project") || "", dirty = false;
const $ = s => document.querySelector(s);
const MUSIC = [["volume","음량 Volume (0~2, 1=원음)","number"],["fade_in","시작 페이드(초) Fade in","number"],["fade_out","끝 페이드(초) Fade out","number"],["start","곡 시작 위치(초) Start at","number"]];
const ENDING = [["title","제목 Title"],["date","날짜 Date"],["welcome","환영 문구 Welcome line"],["show_qr","QR 표시 Show QR","check"],["qr_url","퀴즈 주소 Quiz URL"],["qr_label","QR 안내 QR label"]];
function field(obj, key, label, type="text") {
  const w = document.createElement("div");
  w.innerHTML = `<label>${label}</label>`;
  const el = document.createElement(type === "lines" || type === "multiline" ? "textarea" : "input");
  if (type === "number") { el.type = "number"; el.step = "0.1"; }
  if (type === "check") { el.type = "checkbox"; el.style.width = "auto"; el.checked = !!obj[key];
    el.onchange = () => { obj[key] = el.checked; dirty = true; }; w.appendChild(el); return w; }
  el.value = type === "lines" ? (obj[key] || []).join("\n") : (obj[key] ?? "");
  el.dataset.key = key;
  el.oninput = () => {
    obj[key] = type === "lines" ? el.value.split("\n").filter(x => x.trim()) : type === "number" ? Number(el.value) : el.value;
    total(); dirty = true;
  };
  w.appendChild(el); return w;
}
const durationFormat = new Intl.NumberFormat("ko-KR", {maximumFractionDigits: 2, useGrouping: false});
function total() {
  const duration = cfg.scenes.reduce((a, s) => a + Number(s.duration || 0), 0);
  $("#total").textContent = "총 " + durationFormat.format(duration) + "초";
}
function cityEditor(region, index, regionIndex) {
  const panel = document.createElement("details"); panel.className = "globe-cities";
  panel.innerHTML = `<summary>도시 핀 · City pins</summary>
    <p class="globe-help">City edits do not change country or worldwide totals. 도시를 수정해도 국가·전 세계 합계는 그대로입니다.</p>
    <div class="globe-city-rows"></div><button type="button" class="alt">+ 도시 추가 Add city</button>`;
  const rows = panel.querySelector(".globe-city-rows");
  const cities = region.cities ?? [];
  function drawRows() {
    rows.replaceChildren(...cities.map((city, i) => {
      const row = document.createElement("div"); row.className = "globe-city-row";
      for (const [key, name, type] of [["name","도시 City"],["country","국가 Country"],["count","인원 Count","number"],
                                        ["lat","위도 Lat","number"],["lon","경도 Lon","number"]]) {
        const control = field(city, key, name, type);
        const input = control.querySelector("input");
        input.id = `city-${index}-${regionIndex}-${i}-${key}`;
        control.querySelector("label").htmlFor = input.id;
        if (type === "number") {
          input.step = key === "count" ? "1" : "any";
          input.oninput = () => { city[key] = Number.isNaN(input.valueAsNumber) ? null : input.valueAsNumber; dirty = true; };
        }
        row.append(control);
      }
      const remove = document.createElement("button"); remove.type = "button"; remove.className = "alt";
      remove.textContent = "Remove"; remove.setAttribute("aria-label", `Remove city ${i + 1}`);
      remove.onclick = () => { cities.splice(i, 1); dirty = true; drawRows(); };
      row.append(remove); return row;
    }));
  }
  panel.querySelector("button").onclick = () => {
    region.cities = cities;
    cities.push({name:"", country:"", count:1, lat:region.lat, lon:region.lon});
    dirty = true; drawRows();
    const input = rows.lastElementChild.querySelector("input");
    input.focus();
  };
  drawRows();
  return panel;
}
function globeEditor(scene, index) {
  const g = scene.globe;
  const card = document.createElement("section");
  card.className = "card globe-card"; card.dataset.scene = scene.id;
  card.innerHTML = `<div class="globe-banner"><div><small>AMBASSADOR NETWORK · SCENE ${index + 1}</small><h3>앰버서더 인트로 · Orbit</h3></div><div class="globe-total"></div></div>
    <p class="globe-help">국가별 인원을 수정하면 지역과 전 세계 합계가 자동으로 갱신됩니다.</p>
    <div class="globe-settings"></div>`;
  card.querySelector(".globe-settings").append(field(scene, "duration", "시간(초) Duration", "number"));
  const totals = [];
  function updateCounts() {
    let worldwide = 0;
    g.regions.forEach((region, i) => {
      const n = region.countries.reduce((sum, row) => sum + (row.count ?? 0), 0);
      totals[i].textContent = n + "명";
      worldwide += n;
    });
    card.querySelector(".globe-total").textContent = worldwide + "명";
  }
  g.regions.forEach((region, i) => {
    const details = document.createElement("details"); details.className = "globe-region"; details.open = i === 0;
    const summary = document.createElement("summary"); summary.textContent = region.name;
    const count = document.createElement("span"); totals.push(count); summary.append(count);
    const countries = document.createElement("div"); countries.className = "globe-countries";
    region.countries.forEach(row => {
      const label = document.createElement("label"); label.textContent = row.country;
      const input = document.createElement("input"); input.type = "number"; input.min = 0; input.step = 1;
      input.value = row.count;
      input.oninput = () => { row.count = Number.isNaN(input.valueAsNumber) ? null : input.valueAsNumber; updateCounts(); dirty = true; };
      label.append(input); countries.append(label);
    });
    details.append(summary, countries); card.append(details);
    const korea = region.countries.find(row => row.country === "South Korea");
    if (korea) {
      const names = field(korea, "featured_names", "한국 앰버서더 이름 (한 줄에 한 명) · South Korea ambassador names (one per line)", "lines");
      const id = `featured-names-${index}-${i}`;
      names.querySelector("textarea").id = id;
      names.querySelector("label").htmlFor = id;
      names.style.padding = "4px 12px 10px";
      details.append(names);
    }
    details.append(cityEditor(region, index, i));
  });
  updateCounts();
  return card;
}
function clipEditor(scene, index, clipIndices) {
  const card = document.createElement("section");
  card.className = "card"; card.dataset.scene = scene.id;
  const title = document.createElement("h3"); title.textContent = `${index + 1}. ${scene.id}`;
  const head = document.createElement("div"); head.className = "clip-head"; head.append(title);
  const actions = document.createElement("div"); head.append(actions);
  const position = clipIndices.indexOf(index);
  for (const [direction, name] of [[-1, "↑ 위로 Move up"], [1, "↓ 아래로 Move down"]]) {
    const other = clipIndices[position + direction];
    const button = document.createElement("button"); button.className = "alt"; button.textContent = name;
    button.disabled = other === undefined;
    button.onclick = () => {
      [cfg.scenes[index], cfg.scenes[other]] = [cfg.scenes[other], cfg.scenes[index]];
      dirty = true; draw();
    };
    actions.append(button);
  }
  const fields = document.createElement("div"); fields.className = "grid";
  fields.append(field(scene, "video", "원본 영상 경로 Source clip"), field(scene, "video_start", "원본 시작(초) Source start", "number"),
    field(scene, "duration", "재생 시간(초) Duration", "number"));
  fields.querySelectorAll('input[type="number"]').forEach(input => { input.step = "0.001"; input.min = 0; });
  card.append(head, fields);
  if (scene.subtitles_baked_in) {
    const note = document.createElement("p"); note.className = "globe-help";
    note.textContent = "원본에 포함된 한글 자막을 그대로 사용합니다. · Uses the original burned-in Korean subtitles.";
    card.append(note);
    return card;
  }
  const cues = scene.subtitles ??= [];
  const section = document.createElement("details"); section.className = "clip-cues";
  const summary = document.createElement("summary"); summary.textContent = "한글 자막 · Korean subtitle cues";
  const size = field(scene, "subtitle_font_size", "자막 글자 크기 · Subtitle font size (px at 1080p)", "number");
  const sizeInput = size.querySelector("input");
  sizeInput.value = scene.subtitle_font_size ?? 49;
  sizeInput.min = 1; sizeInput.max = 1080; sizeInput.step = 1;
  sizeInput.setAttribute("aria-label", "자막 글자 크기 · Subtitle font size (px at 1080p)");
  const rows = document.createElement("div");
  const add = document.createElement("button"); add.className = "alt"; add.textContent = "+ 자막 추가 Add cue";
  function drawCues() {
    rows.replaceChildren(...cues.map((cue, i) => {
      const row = document.createElement("div"); row.className = "clip-cue";
      const start = field(cue, "start", "시작(초) Start", "number");
      const end = field(cue, "end", "끝(초) End", "number");
      for (const box of [start, end]) {
        const input = box.querySelector("input"); input.step = "0.01"; input.min = 0;
        input.setAttribute("aria-label", box.textContent + " " + (i + 1));
      }
      const text = field(cue, "text", "한글 자막 Korean subtitle", "multiline"); text.className = "wide";
      text.querySelector("textarea").setAttribute("aria-label", "Korean subtitle " + (i + 1));
      const remove = document.createElement("button"); remove.textContent = "삭제 Remove"; remove.className = "alt";
      remove.onclick = () => { cues.splice(i, 1); dirty = true; drawCues(); };
      row.append(start, end, remove, text);
      return row;
    }));
  }
  add.onclick = () => {
    const start = cues.at(-1)?.end ?? 0;
    if (start >= scene.duration) return say("마지막 자막의 끝 시간을 앞당겨 주세요. · End the last cue earlier.");
    cues.push({start, end: Math.min(start + 2, scene.duration), text: ""}); dirty = true; drawCues();
    rows.lastElementChild.querySelector("textarea").focus();
  };
  drawCues(); section.append(summary, size, rows, add); card.append(section);
  return card;
}
function draw() {
  $("#globe-scenes").replaceChildren(...cfg.scenes.flatMap((s, i) => s.type === "globe" ? [globeEditor(s, i)] : []));
  const clipIndices = cfg.scenes.flatMap((s, i) => s.type === "clip" ? [i] : []);
  $("#clip-scenes").replaceChildren(...clipIndices.map(i => clipEditor(cfg.scenes[i], i, clipIndices)));
  $("#ending").replaceChildren(...ENDING.map(([k, l, ty]) => field(cfg.ending, k, l, ty)));
  const mf = field(cfg.music, "file", "음악 파일 Music file (비우면 음악 없음 / empty = no music)");
  const mu = document.createElement("input"); mu.type = "file"; mu.accept = "audio/mpeg,audio/mp4,audio/wav,.mp3,.m4a,.wav";
  mu.onchange = async () => {
    const f = mu.files[0]; if (!f) return;
    const dot = f.name.lastIndexOf(".");
    const name = f.name.slice(0, dot).replace(/[^\w\-]/g, "_") || "music";
    const r = await fetch(`/api/upload-music/${name}${f.name.slice(dot).toLowerCase()}`, {method: "POST", body: f});
    const j = await r.json();
    if (!r.ok) return say(j.error);
    cfg.music.file = j.file; dirty = true; draw(); say("음악 업로드됨 — 저장을 눌러 주세요");
  };
  mf.className = "wide";
  const row = document.createElement("div"); row.className = "filerow"; row.appendChild(mu);
  if (cfg.music.file) { const a = document.createElement("audio"); a.controls = true; a.src = "/files/" + cfg.music.file; row.appendChild(a); }
  mf.appendChild(row);
  $("#music").replaceChildren(mf, ...MUSIC.map(([k, l, ty]) => field(cfg.music, k, l, ty)));
  $("#video").replaceChildren(field(cfg.video, "accent", "강조색 Accent (#RRGGBB)"), field(cfg.video, "transition_sec", "전환(초) Transition", "number"));
  $("#scenes").replaceChildren(...cfg.scenes.flatMap((s, i) => {
    if (s.type === "globe" || s.type === "clip") return [];
    const c = document.createElement("div"); c.className = "card"; c.dataset.scene = s.id;
    c.innerHTML = `<h3>${i + 1}. ${s.id}${s.type === "ending" ? " (엔딩)" : ""}</h3>`;
    const g = document.createElement("div"); g.className = "grid scene";
    g.append(field(s, "duration", "시간(초) Duration", "number"));
    if (s.type !== "ending") {
      g.append(field(s, "caption_ko", "자막(한) Caption KO"), field(s, "caption_en", "자막(영) Caption EN"));
      const z = {z0: s.zoom?.[0] ?? 1, z1: s.zoom?.[1] ?? 1.1};
      const zf = (k, l) => { const f = field(z, k, l, "number"); f.querySelector("input").addEventListener("input", () => s.zoom = [Number(z.z0), Number(z.z1)]); return f; };
      g.append(zf("z0", "확대 시작 Zoom start"), zf("z1", "확대 끝 Zoom end"), field(s, "pan", "좌우 이동 Pan (-1~1)", "number"));
      const tf = field(s, "terminal", "터미널 줄 Terminal lines (한 줄에 하나, $로 시작하면 명령 / one per line, $ = command)", "lines");
      tf.className = "wide"; tf.querySelector("textarea").rows = Math.max(3, (s.terminal || []).length + 1);
      g.append(tf);
    }
    const im = field(s, "image", "이미지 경로 Image"); im.className = "wide";
    const up = document.createElement("input"); up.type = "file"; up.accept = "image/png,image/jpeg,image/webp";
    up.onchange = async () => {
      const f = up.files[0]; if (!f) return;
      const ext = f.name.slice(f.name.lastIndexOf(".")).toLowerCase();
      const r = await fetch(`/api/upload/${cur === DEF ? s.id : cur + "_" + s.id}${ext}`, {method: "POST", body: f});
      const j = await r.json();
      if (!r.ok) return say(j.error);
      s.image = j.image; dirty = true; draw(); say("이미지 업로드됨 — 저장을 눌러 주세요");
    };
    im.appendChild(up);
    if (s.image) { const t = document.createElement("img"); t.className = "thumb"; t.src = "/files/" + s.image + "?" + Date.now(); t.onerror = () => t.remove(); im.appendChild(t); }
    g.append(im); c.append(g); return [c];
  }));
  total();
}
function say(t) { $("#msg").textContent = t; }
const q = (extra = "") => "?name=" + encodeURIComponent(cur) + extra;
async function save(name = cur) {
  const r = await fetch("/api/config?name=" + encodeURIComponent(name), {method: "PUT", body: JSON.stringify(cfg)});
  const j = await r.json();
  if (!r.ok) { say("오류 Error: " + j.error); return false; }
  cur = name; localStorage.setItem("project", cur); dirty = false;
  say("저장됨 Saved: " + cur); await list(); return true;
}
async function saveAs() {
  const name = (prompt("새 이름 (예: opening, closing) / New name", cur === DEF ? "closing" : cur + "_2") || "").trim();
  if (name) await save(name);
}
let DEF = "";
async function list() {
  const j = await (await fetch("/api/projects")).json(); DEF = j.default;
  if (!j.projects.some(p => p.name === cur)) cur = DEF;
  $("#plist").replaceChildren(...j.projects.map(p => {
    const b = document.createElement("button"); b.className = p.name === cur ? "on" : "";
    b.innerHTML = `${p.name}${p.name === DEF ? '<span class="badge">기본</span>' : ""}<span class="badge${p.qr ? " qr" : ""}">QR ${p.qr ? "켬" : "끔"}</span>`;
    b.onclick = () => openProject(p.name);
    return b;
  }));
}
async function openProject(name) {
  if (dirty && !confirm("저장하지 않은 변경이 있습니다. 버리고 열까요? / Discard unsaved changes?")) return;
  cur = name; localStorage.setItem("project", cur); dirty = false;
  cfg = await (await fetch("/api/config" + q())).json(); cfg.ending ||= {}; cfg.video ||= {}; cfg.music ||= {};
  draw(); await list(); say("열림 Opened: " + cur);
}
async function render(preview) {
  if (!await save()) return;
  const r = await fetch("/api/render" + q(preview ? "&preview=1" : ""), {method: "POST"});
  const j = await r.json(); if (!r.ok) return say(j.error);
  $("#status").hidden = false; poll();
}
async function poll() {
  const s = await (await fetch("/api/status")).json();
  $("#prog").textContent = s.error ? "오류 " + s.error : s.running ? s.progress + "%" : s.output ? "완료 " + s.output : "";
  if (s.running) return setTimeout(poll, 1000);
  if (s.output && !s.error) { const v = $("#vid"); v.hidden = false; v.src = "/files/" + s.output + "?" + Date.now(); }
}
$("#save").onclick = () => save(); $("#saveas").onclick = saveAs; $("#preview").onclick = () => render(true); $("#final").onclick = () => render(false);
list().then(() => openProject(cur));
</script></body></html>
